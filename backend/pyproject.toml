[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "velos-backend"
version = "0.2.0"
description = "Velos BioImaging / SPARK reconstruction backend: FastAPI API, job queue, worker and physics-engine integration"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.9",
    "matplotlib>=3.8",
    "scikit-image>=0.22",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ml = ["torch>=2.2"]

[project.scripts]
velos-worker = "velos_backend.worker:main"
velos-recon = "velos_recon.cli:main"

[tool.setuptools.packages.find]
include = ["velos_backend*", "velos_recon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
