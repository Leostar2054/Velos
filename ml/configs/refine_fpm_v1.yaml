# M4: fine-tune the M3 refinement model (velos-refine-v2) on REAL LED-array FPM data from the
# in-house microscope (blood smear and leaf section, 633 nm, 4x/0.10, 15 x 15 LEDs).
# Real pairs: input = EPRY reconstruction from a reduced LED set (all LEDs inside 1.1 x NA plus a
# random 30 % or 50 % of the dark-field LEDs), target = EPRY reconstruction from all usable LEDs of
# the same acquisition. Only the LEFT 65 % of each high-resolution field and the training draws
# (sub_02 ... sub_05) are used; the right 35 %, the test draws sub_00/sub_01 and the side regions
# of the sensor (never packed for training) are the test set. A small synthetic share keeps the
# model's earlier behaviour (and gives the validation loss).
name: refine_fpm_v1
data:
  root: data/synthetic_v2
  limit_train: 48
  crop: 128
  norm: median_ramp
  target_frame: input
  preload: true
  real:
    root: [data/fpm/blood_222619, data/fpm/blood_223858, data/fpm/blood_225108, data/fpm/leaf_214040, data/fpm/leaf_215808]
    subsets: [2, 3, 4, 5]
    col_range: [0.0, 0.65]
    n_per_epoch: 480
    crop: 128
model:
  base: 32
  depth: 4
  residual: true
train:
  epochs: 10
  batch_size: 8
  lr: 0.0003
  pct_start: 0.1
  weight_decay: 0.0001
  seed: 1
  loss: phase_aware
  w_phase: 1.0
  w_grad: 0.5
  num_workers: 0
  init_from: runs/refine_v2/best.pt
  select: last
