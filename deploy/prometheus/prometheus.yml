# Prometheus configuration for the Velos stack (compose profile "monitoring").
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: velos-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # if VELOS_METRICS_TOKEN is set:
    # authorization: {type: Bearer, credentials: "<token>"}
